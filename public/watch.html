<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Watch · WeddingCast</title>
<meta name="theme-color" content="#141210">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="page-watch">

<header class="topbar">
  <a class="brand" href="/"><span class="brand-rings" aria-hidden="true"></span><span id="siteTitle">WeddingCast</span></a>
  <span id="liveChip" class="chip chip-idle">…</span>
</header>

<main class="wrap wrap-watch">

  <section class="player-shell">
    <div id="playerBox" class="player-box">
      <video id="video" playsinline preload="auto" class="vid vid-active"></video>
      <video id="videoB" playsinline preload="auto" class="vid"></video>

      <div id="tapStart" class="overlay overlay-tap" hidden>
        <button id="btnTap" class="tap-btn">▶<span>Tap to watch with sound</span></button>
      </div>
      <div id="spinner" class="overlay overlay-spin" hidden><div class="spin"></div></div>
      <div id="waitCard" class="overlay overlay-msg" hidden>
        <div class="wait-card">
          <h2 id="waitTitle">Waiting for the first pictures…</h2>
          <p id="waitMsg" class="muted">The stream will start automatically.</p>
        </div>
      </div>

      <div id="catchup" class="catchup" hidden></div>
    </div>

    <div class="controls">
      <button id="btnPlay" class="ctl" aria-label="Play/Pause">⏸</button>
      <button id="btnMute" class="ctl" aria-label="Mute">🔇</button>
      <span id="timeLabel" class="time">0:00</span>
      <input id="seekBar" class="seek" type="range" min="0" max="1000" value="1000" step="1" aria-label="Seek">
      <button id="btnLive" class="ctl ctl-live">LIVE</button>
      <button id="btnFull" class="ctl" aria-label="Fullscreen">⛶</button>
    </div>
  </section>

  <section class="stream-meta">
    <h1 id="streamTitle">…</h1>
    <p class="meta-line">
      <span id="metaRes" class="tag" hidden></span>
      <span id="metaViewers"></span>
      <span id="metaStatus" class="muted"></span>
    </p>
  </section>

</main>

<script src="/js/common.js"></script>
<script src="/js/player.js"></script>
<script src="/js/watch.js"></script>
</body>
</html>
